 <div class="textbox-wrapper">

<script>
	/*==================================================
    CUSTOM SLIDER ENGINE
==================================================*/

class CustomSlider{

    constructor(id){

        this.el=document.getElementById(id);

        this.track=this.el.querySelector(".track");
        this.thumb=this.el.querySelector(".thumb");

        this.dragging=false;
        this.value=1;

        this.readCSS();
        this.updateThumb();
        this.bind();

    }

    readCSS(){

        const css=getComputedStyle(this.el);

        this.start=parseFloat(
            css.getPropertyValue("--track-top")
        );

        this.length=parseFloat(
            css.getPropertyValue("--track-height")
        );

        this.end=this.start+this.length;

    }

    bind(){

        this.thumb.addEventListener("mousedown",(e)=>{

            e.preventDefault();

            this.dragging=true;

        });

        this.track.addEventListener("mousedown",(e)=>{

            e.preventDefault();

            this.dragging=true;

            this.move(e.clientY);

        });

        document.addEventListener("mousemove",(e)=>{

            if(!this.dragging) return;

            this.move(e.clientY);

        });

        document.addEventListener("mouseup",()=>{

            this.dragging=false;

        });

        window.addEventListener("resize",()=>{

            this.readCSS();
            this.updateThumb();

        });

    }

    move(mouseY){

        const rect=this.el.getBoundingClientRect();

        let percent=((mouseY-rect.top)/rect.height)*100;

        percent=Math.max(
            this.start,
            Math.min(percent,this.end)
        );

        this.value=
            (percent-this.start)/this.length;

        this.updateThumb();

        if(this.onChange){

            this.onChange(this.value);

        }

    }

    updateThumb(){

        const percent=

            this.start+

            this.length*this.value;

        this.thumb.style.top=

            percent+"%";

    }

}

/*==================================================
    CREATE SLIDERS
==================================================*/

const sliders={

    epi:new CustomSlider("epi"),

    ppi:new CustomSlider("ppi"),

    size:new CustomSlider("size"),

    tracking:new CustomSlider("tracking"),

    leading:new CustomSlider("leading")

};

/*----------------------------------------
    DEFAULT SLIDER VALUE
----------------------------------------*/

sliders.size.value = 1.0;
sliders.tracking.value = 0.18;
sliders.leading.value = 0.30;
sliders.epi.value = 1;
sliders.ppi.value = 0.5; 

/* 슬라이더 위치 갱신 */
Object.values(sliders).forEach(slider=>{
    slider.updateThumb();
});


/*==================================================
    FONT ENGINE
==================================================*/

const textbox=document.querySelector(".textbox");
const title=document.querySelector(".title");


const EPI=[3,5,7,13,26];
const PPI=[30,60,100];


const SETTING={

    fontSize:[16,120],

    tracking:[-5,20],

    leading:[0.8,2.2]

};


function map(value,min,max){

    return min+(max-min)*value;

}


function currentFont(){

    const epi=

        EPI[
            Math.round(
                sliders.epi.value*(EPI.length-1)
            )
        ];

    const ppi=

        PPI[
            Math.round(
                sliders.ppi.value*(PPI.length-1)
            )
        ];

    return `"${epi}EPI-${ppi}PPI"`;

}


/*----------------------------------------
    APPLY FONT
----------------------------------------*/

function updateFont(){

    const family=currentFont();


    /* TITLE */

    if(title){

        title.style.fontFamily=family;

    }


    /* TEXT */

    textbox.style.fontFamily=family;

    textbox.style.fontSize=

        map(
            sliders.size.value,
            ...SETTING.fontSize
        )+"px";


    textbox.style.letterSpacing=

        map(
            sliders.tracking.value,
            ...SETTING.tracking
        )+"px";


    textbox.style.lineHeight=

        map(
            sliders.leading.value,
            ...SETTING.leading
        );


    alignBottom();

}


/*----------------------------------------
    CONNECT SLIDER
----------------------------------------*/

Object.values(sliders).forEach(slider=>{

    slider.onChange=()=>{

        updateFont();

    };

});




/*==================================================
    TEXT ENGINE
==================================================*/

const wrapper=document.querySelector(".textbox-wrapper");


/*----------------------------------------
    DEFAULT TEXT
----------------------------------------*/

if(textbox.innerHTML.trim()===""){

    textbox.innerHTML="Weave your Type";

}

/*----------------------------------------
    ALIGN BOTTOM
----------------------------------------*/

function alignBottom(){

    const diff=

        wrapper.clientHeight-

        textbox.scrollHeight;

    textbox.style.bottom=

        Math.min(0,diff)+"px";

}


/*----------------------------------------
    CARET
----------------------------------------*/

function focusInput(){

     textbox.focus();

}


/*----------------------------------------
    INPUT
----------------------------------------*/

textbox.addEventListener("input",()=>{

    alignBottom();

});

/*----------------------------------------
    CLICK
----------------------------------------*/

wrapper.addEventListener("mousedown",()=>{

    focusInput();

});


/*----------------------------------------
    WINDOW
----------------------------------------*/

window.addEventListener("resize",()=>{

    alignBottom();

});


/*----------------------------------------
    INITIALIZE
----------------------------------------*/

function initialize(){

    updateFont();

	alignBottom();

	focusInput();

}

window.addEventListener("load",initialize);
</script>
